name: Daily rebuild
# Triggers the Cloudflare Pages deploy hook every day at 09:00 IST (03:30 UTC),
# so posts dated today go live. New commits also rebuild automatically via Cloudflare's Git integration.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
